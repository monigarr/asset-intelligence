; Asset Intelligence Space: API + nginx in one container (runs as UID 1000).
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord-space.pid
logfile=/tmp/supervisord-space.log
loglevel=info

[program:api]
command=/usr/local/bin/uvicorn --factory app.api.main:create_app --host 127.0.0.1 --port 8000 --workers 1
directory=/home/user/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/space.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
