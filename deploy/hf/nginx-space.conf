# Space frontend: external :7860 -> UI static + /v1 proxy to local uvicorn.
# Non-root safe: pid/logs/temp under /tmp; no privileged ports.
pid /tmp/nginx-space.pid;
error_log /tmp/nginx-space-error.log warn;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  access_log /tmp/nginx-space-access.log;
  client_body_temp_path /tmp/nginx-space/body;
  proxy_temp_path /tmp/nginx-space/proxy;
  fastcgi_temp_path /tmp/nginx-space/fastcgi;
  uwsgi_temp_path /tmp/nginx-space/uwsgi;
  scgi_temp_path /tmp/nginx-space/scgi;
  server {
    listen 7860;
    root /usr/share/nginx/html;
    index index.html;
    location /v1/ {
      client_max_body_size 25m;
      proxy_pass http://127.0.0.1:8000;
    }
    location = /index.html {
      add_header Cache-Control "no-store";
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
