name: CI — Production Readiness (Startup Track)

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pre-commit
      - name: Lint
        run: ruff check app/ eval/ tests/
      - name: Test with coverage gate
        run: pytest tests/ -q --cov=app --cov-fail-under=70
      - name: Meta-only check
        run: make verify-meta-only
      - name: SBOM
        run: pip freeze > sbom.txt
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.txt

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build and test UI
        run: |
          cd app/ui
          npm ci
          npm run build
          npm test

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config --quiet
      - name: Build API image
        run: docker compose build api

  live:
    runs-on: ubuntu-24.04
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate 5 live cases
        if: ${{ env.META_API_KEY != '' }}
        env:
          META_API_TIMEOUT_S: '180'
        run: python -m app.synthetic --out eval/cases/synthetic --suites clear --limit 5
      - name: Live slice (ARCH 13)
        if: ${{ env.META_API_KEY != '' }}
        env:
          META_API_TIMEOUT_S: '180'
        run: python -m eval.run --mode live --cases-dir eval/cases/synthetic --suites clear --limit 5 --out eval-live.json --skip-gates latency_p95_ms
      - name: Upload live report
        if: ${{ always() && env.META_API_KEY != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-live
          path: eval-live.json
