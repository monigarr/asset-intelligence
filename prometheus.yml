# Prometheus: scrape the API /metrics + collector-exported pipeline metrics.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: asset-intel-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
