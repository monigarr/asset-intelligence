# Static UI serving + /v1 proxy to the API container.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    # Field photos exceed nginx's 1m default; allow multi-image inspections.
    client_max_body_size 25m;
    proxy_pass http://api:8000;
  }

  # SPA shell: always revalidate so deploys take effect immediately.
  # Hashed /assets/* files remain cacheable by default.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
